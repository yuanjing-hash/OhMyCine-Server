name: Server CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            go.sum
            webui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Verify Server-only beta release contract
        run: |
          python3 .github/scripts/server_beta_release_guard.py check-workflow
          python3 .github/scripts/test_server_beta_release_guard.py

      - name: Verify Web UI
        working-directory: webui
        run: |
          npm ci
          npm run permissions:check
          npm run test
          npm run typecheck
          npm run lint
          npm run build
          go mod verify
          go test .

      - name: Verify Server
        run: |
          go mod download
          go mod verify
          go build ./...
          go test ./...
          go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
