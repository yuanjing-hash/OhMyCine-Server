name: Server CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            go.sum
            webui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build embedded Web UI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Compile Server and Node
        run: |
          go mod verify
          go build -tags webui -o "$RUNNER_TEMP/ohmycine-server" ./cmd/server
          go build -o "$RUNNER_TEMP/ohmycine-node" ./cmd/node
