name: Server CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            go.sum
            webui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Verify Server-only beta release contract
        run: |
          python3 .github/scripts/server_beta_release_guard.py check-workflow
          python3 .github/scripts/test_server_beta_release_guard.py
          python3 .github/scripts/test_docker_release_guard.py
          python3 .github/scripts/test_server_release_source.py
          pwsh -NoLogo -NoProfile -File scripts/test-install-node.ps1

      - name: Verify browser companion
        working-directory: browser-companion
        run: |
          npm ci --omit=dev --ignore-scripts
          npm test
          python3 ../.github/scripts/test_browser_packaging.py

      - name: Verify Web UI
        working-directory: webui
        run: |
          npm ci
          npm run test
          npm run lint
          npm run build
          go mod verify
          go test .

      - name: Verify Server
        run: |
          go mod verify
          go test ./... -timeout 30m

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
