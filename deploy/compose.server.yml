services:
  server:
    image: ghcr.io/yuanjing-hash/ohmycine-server:${OMC_IMAGE_TAG:-beta}
    restart: unless-stopped
    init: true
    shm_size: "256mb"
    ports:
      - "${OMC_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      OMC_PUBLIC_ORIGIN: ${OMC_PUBLIC_ORIGIN:-http://127.0.0.1:3000}
    volumes:
      - ./data:/var/lib/ohmycine
      # 启动前将下面的中文占位符替换为实际绝对路径；不需要的挂载可删除。
      - "<宿主机媒体库目录>:/media"
      - "<下载工具实际使用的宿主机下载目录>:/downloads"
      # Optional STRM output directory:
      # - /srv/strm:/strm
    stop_grace_period: 60s
